name: Build Aura Audio Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund --legacy-peer-deps
          fi

      - name: Build Aura Audio web bundle
        run: npm run build

      - name: Package web bundle into Android assets
        run: |
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets
          cp -r dist/. android/app/src/main/assets/

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Accept Android SDK licenses and install SDK 34
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug and Release APKs
        run: gradle -p android assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Prepare APK artifacts
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/AuraAudio-debug.apk
          if [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk apk-output/AuraAudio-release-unsigned.apk
          fi
          ls -lh apk-output/

      - name: Upload Android APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AuraAudio-Android-APK
          path: apk-output/*.apk
          retention-days: 30

      - name: Publish GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apk-output/*.apk
          generate_release_notes: true
